<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WE NEED YOUR HELP</title>
    
    <!-- Import Google Font: Shrikhand -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Shrikhand&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            color: #333;
        }

        /* Header Section */
        .site-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 25px 15px;
            background-color: #ffffff;
            border-bottom: 1px solid #ddd;
        }

        /* 4x Enlarged Circular Avatar */
        .profile-avatar {
            width: 240px;
            height: 240px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 15px;
        }

        /* Shrikhand Custom Heading */
        .site-title {
            font-family: 'Shrikhand', cursive;
            font-size: 2.2rem;
            letter-spacing: 1px;
            color: #111111;
            line-height: 1.2;
        }

        /* Scrolling Marquee Bar */
        .scrolling-bar {
            background-color: #111111;
            color: #ffffff;
            overflow: hidden;
            white-space: nowrap;
            padding: 10px 0;
            font-size: 0.9rem;
        }

        .scrolling-text {
            display: inline-block;
            padding-left: 100%;
            animation: marquee 12s linear infinite;
        }

        @keyframes marquee {
            0%   { transform: translate(0, 0); }
            100% { transform: translate(-100%, 0); }
        }

        /* Navigation Bar */
        .main-nav {
            background-color: #222222;
        }

        .main-nav ul {
            display: flex;
            justify-content: space-around;
            list-style: none;
            overflow-x: auto;
            padding: 12px 0;
        }

        .main-nav a {
            color: #ffffff;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.85rem;
            padding: 8px 12px;
            text-transform: uppercase;
        }

        .main-nav a:hover {
            color: #ffca28;
        }

        /* Main Body Content */
        .content {
            padding: 30px 20px;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- Header Section -->
    <header class="site-header">
        <img src="avatar.png" alt="Logo" class="profile-avatar">
        <h1 class="site-title">WE NEED YOUR HELP</h1>
    </header>

    <!-- Scrolling Text Bar -->
    <div class="scrolling-bar">
        <div class="scrolling-text">Welcome • Scanned via QR code • Important updates below •</div>
    </div>

    <!-- Navigation Menu -->
    <nav class="main-nav">
        <ul>
            <li><a href="#about">ABOUT</a></li>
            <li><a href="#explainers">EXPLAINERS</a></li>
            <li><a href="#how-to-help">How To Help</a></li>
            <li><a href="#other">Other</a></li>
        </ul>
    </nav>

    <!-- Main Content Area -->
    <main class="content">
        <h2>Welcome</h2>
        <p>Content for your landing page will go here.</p>
    </main>

</body>
</html>
