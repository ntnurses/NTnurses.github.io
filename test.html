<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4; /* Adjust to match your theme */
            color: #333;
        }

        /* Top Header Bar */
        .site-header {
            display: flex;
            align-items: center;
            padding: 15px;
            background-color: #ffffff;
            border-bottom: 1px solid #ddd;
        }

        /* Top Left Circular Image */
        .profile-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%; /* Makes any square image a perfect circle */
            object-fit: cover;
            margin-right: 15px;
        }

        .site-title {
            font-size: 1.4rem;
            font-weight: bold;
        }

        /* Scrolling Announcement Bar */
        .scrolling-bar {
            background-color: #111;
            color: #fff;
            overflow: hidden;
            white-space: nowrap;
            padding: 8px 0;
            font-size: 0.9rem;
        }

        .scrolling-text {
            display: inline-block;
            padding-left: 100%;
            animation: marquee 12s linear infinite;
        }

        @keyframes marquee {
            0%   { transform: translate(0, 0); }
            100% { transform: translate(-100%, 0); }
        }

        /* Navigation Bar */
        .main-nav {
            background-color: #222;
        }

        .main-nav ul {
            display: flex;
            justify-content: space-around;
            list-style: none;
            overflow-x: auto; /* Allows horizontal swipe on small screens if menu is long */
            padding: 10px 0;
        }

        .main-nav a {
            color: #fff;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.85rem;
            padding: 8px 12px;
            text-transform: uppercase;
        }

        .main-nav a:hover {
            color: #ffca28; /* Accent color on hover/tap */
        }

        /* Main Content Area */
        .content {
            padding: 20px;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- Header Section -->
    <header class="site-header">
        <img src="avatar.png" alt="Profile" class="profile-avatar">
        <h1 class="site-title">Your Brand Name</h1>
    </header>

    <!-- Scrolling Text Bar -->
    <div class="scrolling-bar">
        <div class="scrolling-text">Welcome to my site! • Scanned via QR code • Updates coming soon! •</div>
    </div>

    <!-- Navigation Menu -->
    <nav class="main-nav">
        <ul>
            <li><a href="#about">ABOUT</a></li>
            <li><a href="#explainers">EXPLAINERS</a></li>
            <li><a href="#how-to-help">How To Help</a></li>
            <li><a href="#other">Other</a></li>
        </ul>
    </nav>

    <!-- Main Body Area -->
    <main class="content">
        <h2>Welcome</h2>
        <p>Your main page content will go here.</p>
    </main>

</body>
</html>
